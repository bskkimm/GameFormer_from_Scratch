<text x="65" y="549" font-size="17" font-weight="normal" text-anchor="start" fill="#586b80">First AdamW step (toy: lr = 0.1, decay = 0)</text>
<text x="65" y="588" font-size="24" font-weight="bold" text-anchor="start" fill="#172b45">m̂ = 2     v̂ = 4</text>
<text x="65" y="630" font-size="23" font-weight="bold" text-anchor="start" fill="#008b87">w_new = 2 − 0.1 · 2 / √4 = 1.9</text>
